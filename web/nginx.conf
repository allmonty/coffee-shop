server {
  listen 3000;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;

    # Without these, nginx buffers the SSE response and every token arrives in
    # one lump when the turn ends (spec §10). The whole streaming design dies
    # quietly here if they are missing.
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 300s;
  }
}
