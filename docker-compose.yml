# Local development stack (spec §10).
#
# Services arrive as the milestones need them; `llm` and `otel` land in M2/M3.
# `api` must never depend on `otel` — telemetry is best-effort and the app has
# to start and serve with no collector reachable.

services:
  web:
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      - api

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
      POSTGRES_DB: coffee_shop
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee_shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://coffee:coffee@db:5432/coffee_shop
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # Traces, metrics and logs in one container: OTel Collector + Tempo +
  # Prometheus + Loki + Grafana, all pre-wired (spec §9.1).
  #
  # Grafana is on 3001 because the frontend takes 3000. Nothing depends on this
  # service — telemetry is best-effort and the shop opens without it.
  otel:
    image: grafana/otel-lgtm
    ports:
      - "3001:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - otel_data:/data
      - ./ops/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/coffee-shop:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin

volumes:
  db_data:
  otel_data:
