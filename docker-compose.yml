# Local development stack (spec §10).
#
# THE MODEL IS NOT STARTED BY DEFAULT. `docker compose up` gives you web, api,
# db and otel, and expects Ollama on the host at :11434. That is the fast path
# on Apple Silicon, where Docker has no GPU passthrough.
#
# For a fully self-contained stack (Linux, CI, or a machine with no Ollama):
#
#     make up-with-llm            # or:
#     OLLAMA_BASE_URL=http://llm:11434/v1 docker compose --profile llm up -d
#
# `api` must never depend on `otel` — telemetry is best-effort and the app has
# to start and serve with no collector reachable. It does not depend on `llm`
# either: a missing model degrades one endpoint, it does not stop the shop
# opening.

services:
  web:
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      - api

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
      POSTGRES_DB: coffee_shop
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee_shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://coffee:coffee@db:5432/coffee_shop
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b-instruct}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  # Traces, metrics and logs in one container: OTel Collector + Tempo +
  # Prometheus + Loki + Grafana, all pre-wired (spec §9.1).
  #
  # Grafana is on 3001 because the frontend takes 3000. Nothing depends on this
  # service — telemetry is best-effort and the shop opens without it.
  otel:
    image: grafana/otel-lgtm
    ports:
      - "3001:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - otel_data:/data
      - ./ops/grafana/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards/coffee-shop:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin

  # Opt-in: `docker compose --profile llm up`.
  #
  # Left out of the default stack on purpose. Docker Desktop on Apple Silicon
  # has no GPU passthrough, so this runs CPU-only and is roughly an order of
  # magnitude slower than `ollama serve` on the host — slow enough to make
  # prompt iteration miserable. Use the host there; use this profile on Linux,
  # in CI, or when you want one command to bring up everything.
  #
  # The first start downloads several GB. Weights live in a named volume so it
  # happens once.
  llm:
    profiles: ["llm"]
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - llm_models:/root/.ollama
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b-instruct}
    # The image's entrypoint is `ollama serve`, which has no way to pull a model
    # first. Serve in the background, wait for the API, pull, then hand the
    # foreground back to the server.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list >/dev/null 2>&1; do sleep 1; done
        echo "pulling $${OLLAMA_MODEL} (first run downloads several GB)..."
        ollama pull "$${OLLAMA_MODEL}"
        wait
    healthcheck:
      # Checks the configured model is actually present, not merely that the
      # server answers — otherwise this reports healthy mid-download and the
      # first conversation fails with a confusing 404.
      test: ["CMD-SHELL", "ollama list | grep -q \"$${OLLAMA_MODEL%%:*}\""]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s

volumes:
  db_data:
  otel_data:
  llm_models:
