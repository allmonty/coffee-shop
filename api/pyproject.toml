[project]
name = "coffee-shop-api"
version = "0.1.0"
description = "Conversational coffee shop — FastAPI + LangGraph backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "opentelemetry-sdk>=1.29,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "langgraph>=0.2.60,<0.3",
    "langchain-openai>=0.2.14,<0.3",
    "langgraph-checkpoint-postgres>=2.0.9,<3.0",
    "psycopg[binary,pool]>=3.2,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<0.26",
    "pytest-timeout>=2.3,<3.0",
    "httpx>=0.28,<0.29",
    "ruff>=0.9,<0.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Autogenerated by `alembic revision --autogenerate`; reformatting it would only
# create noise in the diff of every future migration.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Concurrency tests hold real transactions. A lock-wait bug should fail the
# suite in seconds, not hang it — the whole suite runs in under two.
timeout = 30
