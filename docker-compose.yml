# Local development stack (spec §10).
#
# Services arrive as the milestones need them; `llm` and `otel` land in M2/M3.
# `api` must never depend on `otel` — telemetry is best-effort and the app has
# to start and serve with no collector reachable.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
      POSTGRES_DB: coffee_shop
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee_shop"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://coffee:coffee@db:5432/coffee_shop
      OTEL_ENABLED: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
